name: CI

# Lint, format, and test checks for the CareAI backend. Runs on every push to
# main and on all pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pin the interpreter to the project's floor (pyproject requires >=3.13)
      # so CI exercises the same version range the code targets.
      - name: Set up Python
        run: uv python install 3.13

      # The dev dependency group carries black, flake8, coverage, pytest, and
      # the fixture-generation deps the suite imports.
      - name: Sync dependencies
        run: uv sync

      # black/flake8 share the 88-col line length; --check fails on any file
      # that isn't already formatted rather than rewriting it.
      - name: Black format check
        run: uv run black --check CareAI tests

      - name: Flake8 lint
        run: uv run flake8 CareAI tests

      # Mirrors the `test` taskipy task: run under coverage, then print the
      # report. The suite is self-contained (no live Postgres or network).
      - name: Pytest
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
